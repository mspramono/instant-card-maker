<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Menambahkan Font Awesome untuk Icon IG -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Gaya Dasar & Animasi */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 0; color: #333; overflow-x: hidden; }

        /* HALAMAN INTRO - MODIFIED */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a2a3a 0%, #000000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; color: white; transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .intro-content { text-align: center; animation: fadeIn 1.5s ease-out; }
        .brand-logo { font-size: 56px; font-weight: 800; letter-spacing: 4px; margin-bottom: 5px; color: #3498db; }
        .brand-sub { font-size: 16px; font-weight: 400; letter-spacing: 2px; opacity: 0.9; text-transform: uppercase; margin-bottom: 10px; color: #ecf0f1; }

        /* Kredit & IG Style */
        .dev-credit { font-size: 13px; font-weight: 300; opacity: 0.7; font-style: italic; margin-bottom: 20px; }
        .social-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: #fff; text-decoration: none; font-size: 14px;
            margin-bottom: 40px; padding: 8px 15px; border-radius: 20px;
            background: rgba(255,255,255,0.1); transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .social-link:hover { background: rgba(225, 48, 108, 0.2); border-color: #e1306c; transform: translateY(-2px); }
        .social-link i { font-size: 18px; color: #e1306c; }

        .btn-start {
            padding: 15px 45px; font-size: 16px; font-weight: bold; color: white;
            background: #3498db; border: none; border-radius: 50px; cursor: pointer;
            transition: 0.3s; box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-start:hover { background: #2980b9; transform: scale(1.05); box-shadow: 0 6px 20px rgba(52, 152, 219, 0.6); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* MAIN APP CONTENT */
        #app-content { padding: 20px; opacity: 0; transition: opacity 1s; }
        .no-print { max-width: 1000px; margin: 0 auto 30px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .brand-tag { font-size: 12px; background: #3498db; color: white; padding: 2px 8px; border-radius: 4px; vertical-align: middle; }

        .section { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin: 15px 0 5px; font-size: 14px; color: #34495e; }
        textarea { width: 100%; height: 120px; border: 2px solid #ddd; border-radius: 8px; padding: 12px; font-family: monospace; box-sizing: border-box; }

        .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }

        #editor-wrapper { background: #dfe6e9; padding: 50px; border-radius: 8px; display: flex; justify-content: center; margin-top: 25px; border: 2px dashed #b2bec3; position: relative; }
        #editor-wrapper::before { content: '🎨 MODE DESAIN'; position: absolute; top: 15px; font-size: 12px; font-weight: bold; color: #636e72; }

        .card {
            width: 9.5cm; height: 6cm; background: white; border: 0.5px solid #000;
            position: relative; overflow: hidden; box-sizing: border-box;
            background-size: 100% 100%; background-repeat: no-repeat; background-position: center;
            background-color: #fff;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .draggable {
            position: absolute; cursor: move; display: flex; flex-direction: column;
            overflow: hidden; box-sizing: border-box; touch-action: none;
        }
        #sample-card .draggable { border: 1px dashed #3498db; background: rgba(52, 152, 219, 0.05); }

        .photo-el { width: 2.5cm; height: 3.5cm; top: 80px; left: 20px; border: 1px solid #333 !important; }
        .title-el { width: 100%; height: 50px; top: 15px; left: 0; font-weight: bold; align-items: center; justify-content: center; text-align: center; }
        .data-el { width: 5.5cm; height: 3.5cm; top: 85px; left: 130px; line-height: 1.2; }

        .data-table { width: 100%; border-collapse: collapse; font-size: inherit; }
        .data-table td { padding: 1px 0; vertical-align: top; }
        .label-col { white-space: nowrap; font-weight: bold; width: 1%; padding-right: 5px !important; }
        .sep-col { width: 10px; text-align: center; }

        .controls { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
        button { flex: 1; min-width: 150px; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; color: white; transition: 0.2s; }
        .btn-reset { background: #e74c3c; }
        .btn-gen { background: #27ae60; }
        .btn-print { background: #3498db; }
        .btn-download { background: #8e44ad; }
        button:hover { opacity: 0.8; transform: translateY(-1px); }

        .pdf-page {
            display: grid;
            grid-template-columns: 9.5cm 9.5cm;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            page-break-after: always;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; margin: 0; }
            .pdf-page { margin-bottom: 0; padding: 0.5cm; gap: 5px; }
        }
    </style>
</head>
<body>

<div id="intro-screen">
    <div class="intro-content">
        <div class="brand-logo">MSP</div>
        <div class="brand-sub">Digital Product & Service</div>
        <div class="dev-credit">Developed by M. Sidiq Pramono, Powered by AI</div>

        <a href="https://www.instagram.com/frangmono" target="_blank" class="social-link">
            <i class="fab fa-instagram"></i>
            <span>@frangmono</span>
        </a>
        <br>
        <button class="btn-start" onclick="startApp()">Mulai Desain Sekarang</button>
    </div>
</div>

<div id="app-content">
    <div class="no-print">
        <h2>
            🛠️ Pro Card Studio v8
            <span class="brand-tag">Powered by MSP</span>
        </h2>

        <div class="section">
            <label>1. Data Excel (Copy-Paste):</label>
            <textarea id="inputData" placeholder="Nama	 NISN	 Kelas&#10;Budi Santoso	 1001	 X-IPA 1&#10;Ani Wijaya	 1002	 X-IPA 2"></textarea>
        </div>

        <div class="upload-grid">
            <div class="inner-sec">
                <label>2. Judul:</label>
                <input type="text" id="cardTitle" value="KARTU PELAJAR" oninput="updateSampleTitle()">
            </div>
            <div class="inner-sec">
                <label>3. Kolom Foto (Header):</label>
                <input type="text" id="matchKey" placeholder="NISN">
            </div>
            <div class="inner-sec">
                <label>4. Folder Foto:</label>
                <input type="file" id="photoFiles" webkitdirectory directory multiple>
            </div>
            <div class="inner-sec">
                <label>5. Background:</label>
                <input type="file" id="bgFile" accept="image/*">
            </div>
        </div>

        <div id="editor-wrapper">
            <div id="sample-card" class="card">
                <div id="item-title" class="draggable title-el" data-x="0" data-y="0">KARTU PELAJAR</div>
                <div id="item-photo" class="draggable photo-el" data-x="0" data-y="0">FOTO</div>
                <div id="item-data" class="draggable data-el" data-x="0" data-y="0">
                    <table class="data-table">
                        <tr><td class="label-col">NAMA</td><td class="sep-col">:</td><td>CONTOH</td></tr>
                        <tr><td class="label-col">NISN</td><td class="sep-col">:</td><td>12345678</td></tr>
                    </table>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-reset" onclick="resetApp()">🔄 Reset</button>
            <button class="btn-gen" onclick="generateCards()">⚡ Terapkan Layout</button>
            <button class="btn-download" onclick="downloadPDF()">💾 Simpan PDF (Fix Black Result)</button>
            <button class="btn-print" onclick="window.print()">🖨️ Cetak</button>
        </div>
    </div>

    <div id="container"></div>
</div>

<script>
    let photoDb = {};
    let globalBg = "";

    function startApp() {
        const intro = document.getElementById('intro-screen');
        const content = document.getElementById('app-content');
        intro.style.transform = 'translateY(-100%)';
        setTimeout(() => {
            intro.style.display = 'none';
            content.style.opacity = '1';
        }, 800);
    }

    function resetApp() {
        if(confirm("Hapus semua data dan reset form?")) {
            window.location.replace(window.location.href);
        }
    }

    function adjustFontSize(el) {
        if (el.classList.contains('photo-el')) return;
        const height = el.offsetHeight;
        const width = el.offsetWidth;
        let newSize = Math.min(height / 2.5, width / 12);
        if (el.id === 'item-data') newSize = height / 9;
        el.style.fontSize = newSize + 'px';
    }

    interact('.draggable')
      .draggable({
        listeners: { move(event) {
            const target = event.target;
            const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
            const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
            target.style.transform = `translate(${x}px, ${y}px)`;
            target.setAttribute('data-x', x);
            target.setAttribute('data-y', y);
        }}
      })
      .resizable({
        edges: { left: true, right: true, bottom: true, top: true },
        listeners: { move(event) {
            let target = event.target;
            let x = (parseFloat(target.getAttribute('data-x')) || 0);
            let y = (parseFloat(target.getAttribute('data-y')) || 0);
            target.style.width = event.rect.width + 'px';
            target.style.height = event.rect.height + 'px';
            x += event.deltaRect.left;
            y += event.deltaRect.top;
            target.style.transform = `translate(${x}px, ${y}px)`;
            target.setAttribute('data-x', x);
            target.setAttribute('data-y', y);
            adjustFontSize(target);
        }}
      });

    document.getElementById('bgFile').onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => {
            globalBg = ev.target.result;
            document.getElementById('sample-card').style.backgroundImage = `url('${globalBg}')`;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    document.getElementById('photoFiles').onchange = e => {
        photoDb = {};
        for (let file of e.target.files) {
            const name = file.name.split('.')[0];
            const reader = new FileReader();
            reader.onload = ev => photoDb[name] = ev.target.result;
            reader.readAsDataURL(file);
        }
    };

    function updateSampleTitle() {
        document.getElementById('item-title').innerText = document.getElementById('cardTitle').value;
    }

    function getFinalStyle(id) {
        const el = document.getElementById(id);
        const rect = el.getBoundingClientRect();
        const parentRect = document.getElementById('sample-card').getBoundingClientRect();
        return {
            w: el.offsetWidth + 'px',
            h: el.offsetHeight + 'px',
            top: (rect.top - parentRect.top) + 'px',
            left: (rect.left - parentRect.left) + 'px',
            fs: window.getComputedStyle(el).fontSize,
            jc: window.getComputedStyle(el).justifyContent,
            ai: window.getComputedStyle(el).alignItems
        };
    }

    function generateCards() {
        const raw = document.getElementById('inputData').value.trim();
        const container = document.getElementById('container');
        const key = document.getElementById('matchKey').value.trim();
        const titleText = document.getElementById('cardTitle').value;

        if(!raw || !key) return alert("Lengkapi data dan kolom foto!");

        container.innerHTML = '';
        const lines = raw.split('\\n');
        const headers = lines[0].split('\\t').map(h => h.trim());

        const sTitle = getFinalStyle('item-title');
        const sPhoto = getFinalStyle('item-photo');
        const sData = getFinalStyle('item-data');

        let currentPage;

        for (let i = 1; i < lines.length; i++) {
            if(!lines[i].trim()) continue;

            if ((i-1) % 8 === 0) {
                currentPage = document.createElement('div');
                currentPage.className = 'pdf-page html2pdf__page-break';
                container.appendChild(currentPage);
            }

            const cols = lines[i].split('\\t');
            let d = {};
            headers.forEach((h, idx) => d[h] = cols[idx] || '-');

            const imgSrc = photoDb[d[key]] || '';

            let tableHtml = '<table class="data-table">';
            headers.forEach(h => {
                tableHtml += `<tr><td class="label-col">${h.toUpperCase()}</td><td class="sep-col">:</td><td>${d[h]}</td></tr>`;
            });
            tableHtml += '</table>';

            const cardHtml = `
                <div class="card" style="background-image: url('${globalBg}')">
                    <div style="position:absolute; width:${sTitle.w}; height:${sTitle.h}; top:${sTitle.top}; left:${sTitle.left}; font-size:${sTitle.fs}; font-weight:bold; display:flex; align-items:${sTitle.ai}; justify-content:${sTitle.jc}; text-align:center;">${titleText}</div>
                    <div style="position:absolute; width:${sPhoto.w}; height:${sPhoto.h}; top:${sPhoto.top}; left:${sPhoto.left}; border:1px solid #000; background:#eee; display:flex; align-items:center; justify-content:center; overflow:hidden;">
                        ${imgSrc ? `<img src="${imgSrc}" style="width:100%; height:100%; max-width:100%; max-height:100%; object-fit:cover; object-position:center; display:block;">` : 'FOTO'}
                    </div>
                    <div style="position:absolute; width:${sData.w}; height:${sData.h}; top:${sData.top}; left:${sData.left}; font-size:${sData.fs};">${tableHtml}</div>
                </div>
            `;
            currentPage.innerHTML += cardHtml;
        }
        alert("Berhasil memproses " + (lines.length - 1) + " data.");
    }

    async function downloadPDF() {
        const element = document.getElementById('container');
        if(!element.innerHTML) return alert("Klik 'Terapkan Layout' terlebih dahulu!");

        const btn = document.querySelector('.btn-download');
        const originalText = btn.innerText;
        btn.innerText = "⏳ Memproses Massal (Mohon Tunggu)...";
        btn.disabled = true;

        const opt = {
            margin: [0.5, 0.5, 0.5, 0.5],
            filename: 'cetak-kartu-pelajar.pdf',
            image: { type: 'jpeg', quality: 0.95 },
            html2canvas: {
                scale: 1.5,
                useCORS: true,
                logging: false,
                letterRendering: true,
                allowTaint: false
            },
            jsPDF: { unit: 'cm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['css', 'legacy'] }
        };

        setTimeout(() => {
            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            }).catch(err => {
                console.error(err);
                alert("Gagal mengunduh PDF. Coba kurangi jumlah data per sesi.");
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }, 1200);
    }
</script>

</body>
</html>

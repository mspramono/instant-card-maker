<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* Gaya Dasar */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 0; color: #333; overflow-x: hidden; }

        /* INTRO SCREEN */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0d0d12 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; color: white; transition: transform 1s cubic-bezier(0.85, 0, 0.15, 1);
        }
        .intro-content { text-align: center; padding: 20px; }
        .brand-logo-img { width: 300px; max-width: 80vw; filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.6)); margin-bottom: 20px; border-radius: 15px; }
        .brand-sub { font-size: 1.2rem; color: #00ffff; letter-spacing: 4px; font-weight: bold; margin-bottom: 5px; }
        .dev-credit { font-size: 14px; opacity: 0.7; margin-bottom: 20px; }
        .social-link { display: inline-flex; align-items: center; gap: 8px; color: white; text-decoration: none; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 50px; border: 1px solid #00ffff; transition: 0.3s; margin-bottom: 30px; }
        .social-link:hover { background: #00ffff; color: #000; }
        .btn-start { padding: 15px 40px; font-size: 18px; font-weight: bold; background: linear-gradient(45deg, #00ffff, #cc00ff); border: none; border-radius: 5px; cursor: pointer; color: white; box-shadow: 0 0 20px rgba(0,255,255,0.3); }

        /* MAIN APP */
        #app-content { padding: 20px; opacity: 0; transition: 1s; }
        .no-print { max-width: 1000px; margin: 0 auto 30px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .section { margin-bottom: 20px; }
        textarea { width: 100%; height: 120px; border: 2px solid #ddd; border-radius: 8px; padding: 12px; font-family: monospace; box-sizing: border-box; }
        .upload-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }

        #editor-wrapper { background: #dfe6e9; padding: 40px; border-radius: 8px; display: flex; justify-content: center; margin-top: 25px; border: 2px dashed #b2bec3; }
        .card { width: 9.5cm; height: 6cm; background: white; position: relative; overflow: hidden; box-sizing: border-box; background-size: cover; border: 0.1px solid #eee; }
        .draggable { position: absolute; cursor: move; display: flex; flex-direction: column; touch-action: none; border: 1px dashed transparent; }
        #sample-card .draggable { border-color: #3498db; background: rgba(52, 152, 219, 0.1); }
        
        .photo-el { width: 2.5cm; height: 3.5cm; top: 80px; left: 20px; border: 1px solid #333 !important; }
        .title-el { width: 100%; height: 50px; top: 10px; font-weight: bold; align-items: center; justify-content: center; text-align: center; }
        .data-el { width: 5.5cm; height: 3.5cm; top: 85px; left: 130px; line-height: 1.2; font-size: 10px; }

        .data-table { width: 100%; border-collapse: collapse; }
        .label-col { font-weight: bold; white-space: nowrap; padding-right: 5px; }

        .controls { display: flex; gap: 10px; margin-top: 25px; flex-wrap: wrap; }
        button { flex: 1; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; }
        .btn-gen { background: #27ae60; }
        .btn-download { background: #8e44ad; }
        .btn-reset { background: #e74c3c; }

        #container { background: #f0f2f5; padding: 20px; }
        .pdf-page { display: grid; grid-template-columns: 9.5cm 9.5cm; gap: 10px; justify-content: center; margin-bottom: 20px; page-break-after: always; }

        @media print { .no-print { display: none; } #container { padding: 0; } }
    </style>
</head>
<body>

<div id="intro-screen">
    <div class="intro-content">
        <img src="https://i.ibb.co.com/nMPjQmC1/logo-msp.png" alt="MSP Logo" class="brand-logo-img">
        <div class="brand-sub">DIGITAL PRODUCT & SERVICE</div>
        <div class="dev-credit">Developed by M. Sidiq Pramono, powered by AI</div>
        
        <a href="https://instagram.com/frangmono" target="_blank" class="social-link">
            <span>📸 @frangmono</span>
        </a><br>
        
        <button class="btn-start" onclick="startApp()">MASUK SISTEM</button>
    </div>
</div>

<div id="app-content">
    <div class="no-print">
        <h2>🛠️ Pro Card Studio v8 <span style="font-size: 12px; background: #3498db; color: white; padding: 3px 8px; border-radius: 4px;">Powered by MSP</span></h2>
        
        <div class="section">
            <label><b>1. Data Excel (Wajib Header di Baris 1):</b></label>
            <textarea id="inputData" placeholder="Nama	NISN	Kelas&#10;Budi Santoso	1001	X-IPA 1"></textarea>
        </div>

        <div class="upload-grid">
            <div><label>Judul Kartu:</label><input type="text" id="cardTitle" value="KARTU PELAJAR" oninput="updateSample()"></div>
            <div><label>Nama Kolom Foto (Header):</label><input type="text" id="matchKey" placeholder="Contoh: NISN"></div>
            <div><label>Folder Foto Siswa:</label><input type="file" id="photoFiles" webkitdirectory directory multiple></div>
            <div><label>Background Kartu:</label><input type="file" id="bgFile" accept="image/*"></div>
        </div>

        <div id="editor-wrapper">
            <div id="sample-card" class="card">
                <div id="item-title" class="draggable title-el" data-x="0" data-y="0">KARTU PELAJAR</div>
                <div id="item-photo" class="draggable photo-el" data-x="0" data-y="0">FOTO</div>
                <div id="item-data" class="draggable data-el" data-x="0" data-y="0">
                    <table class="data-table">
                        <tr><td class="label-col">NAMA</td><td>: CONTOH</td></tr>
                        <tr><td class="label-col">NISN</td><td>: 12345678</td></tr>
                    </table>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-reset" onclick="location.reload()">🔄 Reset</button>
            <button class="btn-gen" onclick="generateCards()">⚡ Terapkan Layout</button>
            <button class="btn-download" onclick="downloadPDF()">💾 Simpan PDF (Fix Black)</button>
        </div>
    </div>
    <div id="container"></div>
</div>

<script>
    let photoDb = {};
    let globalBg = "";

    function startApp() {
        document.getElementById('intro-screen').style.transform = 'translateY(-100%)';
        setTimeout(() => { 
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('app-content').style.opacity = '1';
        }, 1000);
    }

    // Drag & Resize Logic
    interact('.draggable').draggable({
        listeners: { move(event) {
            let t = event.target;
            let x = (parseFloat(t.getAttribute('data-x')) || 0) + event.dx;
            let y = (parseFloat(t.getAttribute('data-y')) || 0) + event.dy;
            t.style.transform = `translate(${x}px, ${y}px)`;
            t.setAttribute('data-x', x); t.setAttribute('data-y', y);
        }}
    }).resizable({
        edges: { left: true, right: true, bottom: true, top: true },
        listeners: { move(event) {
            let t = event.target;
            let x = (parseFloat(t.getAttribute('data-x')) || 0) + event.deltaRect.left;
            let y = (parseFloat(t.getAttribute('data-y')) || 0) + event.deltaRect.top;
            t.style.width = event.rect.width + 'px';
            t.style.height = event.rect.height + 'px';
            t.style.transform = `translate(${x}px, ${y}px)`;
            t.setAttribute('data-x', x); t.setAttribute('data-y', y);
        }}
    });

    // File Handlers
    document.getElementById('bgFile').onchange = e => {
        let r = new FileReader();
        r.onload = ev => { 
            globalBg = ev.target.result; 
            document.getElementById('sample-card').style.backgroundImage = `url('${globalBg}')`;
        };
        r.readAsDataURL(e.target.files[0]);
    };

    document.getElementById('photoFiles').onchange = e => {
        photoDb = {};
        for (let f of e.target.files) {
            let r = new FileReader();
            let n = f.name.split('.')[0];
            r.onload = ev => photoDb[n] = ev.target.result;
            r.readAsDataURL(f);
        }
    };

    function updateSample() {
        document.getElementById('item-title').innerText = document.getElementById('cardTitle').value;
    }

    function getStyle(id) {
        let el = document.getElementById(id), r = el.getBoundingClientRect(), p = document.getElementById('sample-card').getBoundingClientRect();
        return {
            w: el.offsetWidth+'px', h: el.offsetHeight+'px',
            t: (r.top - p.top)+'px', l: (r.left - p.left)+'px',
            fs: window.getComputedStyle(el).fontSize
        };
    }

    function generateCards() {
        let raw = document.getElementById('inputData').value.trim();
        let key = document.getElementById('matchKey').value.trim();
        if(!raw || !key) return alert("Isi data dan Nama Kolom Foto!");

        let lines = raw.split('\n');
        let headers = lines[0].split('\t').map(h => h.trim());
        let container = document.getElementById('container');
        container.innerHTML = '';

        let sT = getStyle('item-title'), sP = getStyle('item-photo'), sD = getStyle('item-data');
        let count = 0;

        for (let i = 1; i < lines.length; i++) {
            if(!lines[i].trim()) continue;
            if (count % 8 === 0) {
                var page = document.createElement('div');
                page.className = 'pdf-page';
                container.appendChild(page);
            }

            let cols = lines[i].split('\t');
            let data = {};
            headers.forEach((h, idx) => data[h] = cols[idx] || '-');

            let tableRows = headers.map(h => `<tr><td class="label-col">${h}</td><td>: ${data[h]}</td></tr>`).join('');
            
            page.innerHTML += `
                <div class="card" style="background-image: url('${globalBg}'); background-color: white;">
                    <div style="position:absolute; width:${sT.w}; height:${sT.h}; top:${sT.t}; left:${sT.l}; font-size:${sT.fs}; font-weight:bold; display:flex; align-items:center; justify-content:center; text-align:center;">${document.getElementById('cardTitle').value}</div>
                    <div style="position:absolute; width:${sP.w}; height:${sP.h}; top:${sP.t}; left:${sP.l}; border:1px solid #000; background:#eee; overflow:hidden;">
                        ${photoDb[data[key]] ? `<img src="${photoDb[data[key]]}" style="width:100%; height:100%; object-fit:cover;">` : ''}
                    </div>
                    <div style="position:absolute; width:${sD.w}; height:${sD.h}; top:${sD.t}; left:${sD.l}; font-size:${sD.fs};">
                        <table class="data-table">${tableRows}</table>
                    </div>
                </div>`;
            count++;
        }
        alert("Berhasil memproses " + count + " data.");
    }

    function downloadPDF() {
        const element = document.getElementById('container');
        if(!element.innerHTML) return alert("Klik Terapkan Layout dulu!");

        const opt = {
            margin: 0.5,
            filename: 'kartu-pelajar.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { 
                scale: 2, 
                useCORS: true, 
                letterRendering: true,
                backgroundColor: '#ffffff' // Paksa background putih agar tidak hitam
            },
            jsPDF: { unit: 'cm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }
</script>
</body>
</html>
